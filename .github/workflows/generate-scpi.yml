name: Générer et déployer SCPI
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site slug (ex: scpi, comparateur-scpi)'
        required: true
        default: 'scpi'
        type: string
      skip_enrich:
        description: 'Sauter la génération IA (utilise les textes déjà générés)'
        required: false
        type: boolean
        default: false
      skip_existing:
        description: 'Ne régénérer que les sections manquantes (économise les tokens)'
        required: false
        type: boolean
        default: false
      only_category:
        description: 'Générer uniquement cette catégorie (ex: Logiciel de paie). Vide = toutes.'
        required: false
        type: string
        default: ''
      schedule:
        description: 'Heure de lancement HH:MM UTC (ex: 01:00). Vide = immediat.'
        required: false
        type: string
        default: ''
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Sérialise les pushs sur main : un seul workflow à la fois pousse sur le repo,
    # pour éviter les courses où 2 workflows lisent le même HEAD puis se rejettent
    # mutuellement au push (`cannot lock ref 'refs/heads/main'`).
    # cancel-in-progress: false → on met en file d'attente plutôt qu'annuler le run en cours.
    concurrency:
      group: deploy-push-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml jinja2 requests
      - name: Generate AI editorial content
        if: ${{ !inputs.skip_enrich }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }}"
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            CMD="$CMD --skip-existing"
          fi
          if [ -n "${{ inputs.only_category }}" ]; then
            CMD="$CMD --only '${{ inputs.only_category }}'"
          fi
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          echo "CMD=$CMD"
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}
      - name: Remove SCPI pages from classement sites
        run: |
          OUTPUT="platform/sites/${{ inputs.site }}/output"
          if [ -f "$OUTPUT/meilleur-"*.html ] || ls $OUTPUT/meilleur-*.html 2>/dev/null; then
            echo "Site classement détecté — suppression pages avis/scpi"
            rm -f $OUTPUT/avis-*.html
            rm -f $OUTPUT/comparatifs-scpi.html
            rm -f $OUTPUT/avis-scpi.html
            echo "✓ Pages supprimées"
          fi
      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/${{ inputs.site }}/
          if git diff --cached --quiet; then
            echo "Rien à commit, on saute le push"
            exit 0
          fi
          git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"
          # ── Retry loop (5 tentatives) ─────────────────────────────────────
          # Filet de sécurité : même si concurrency: deploy-push-main sérialise
          # les workflows GitHub Actions, un push manuel sur main hors workflow
          # peut encore créer une course. On re-fetch + rebase + retry jusqu'à 5x
          # avec backoff progressif (5s, 10s, 15s, 20s, 25s).
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "❌ Rebase impossible — abandon"
              exit 1
            fi
            if git push 2>&1 | tee /tmp/push.log; then
              echo "✓ Push réussi (tentative $attempt)"
              exit 0
            fi
            echo "⚠ Push rejeté (tentative $attempt) :"
            cat /tmp/push.log
            sleep $((attempt * 5))
          done
          echo "❌ Push échoué après 5 tentatives — un autre workflow / commit pousse en boucle"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloudflare Pages
        run: |
          PROJECT="${{ inputs.site }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/$PROJECT")
          if [ "$STATUS" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects"
            sleep 3
          fi
          npm install -g wrangler
          wrangler pages deploy platform/sites/${{ inputs.site }}/output \
            --project-name=$PROJECT \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Setup domains and redirects
        run: |
          python3 platform/scripts/setup_domain.py \
            ${{ inputs.site }} \
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} \
            ${{ secrets.CLOUDFLARE_API_TOKEN }}
