name: Generate SCPI

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site à générer (ex: editions-dp-com)'
        required: true
        type: string
      skip_enrich:
        description: 'Sauter la génération éditoriale IA'
        required: false
        default: false
        type: boolean
      skip_existing:
        description: 'Skip pairs already enriched'
        required: false
        default: false
        type: boolean
      only_category:
        description: 'Limiter à une catégorie'
        required: false
        default: ''
        type: string
      schedule:
        description: 'Schedule (optionnel)'
        required: false
        default: ''
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ── Env au niveau du JOB ─────────────────────────────────────────────
    # INDEXNOW_KEY doit être ici (pas dans un step) pour être accessible
    # dans les conditions `if:` des steps qui suivent.
    env:
      TZ: 'Europe/Paris'
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml jinja2 requests ruamel.yaml
      - name: Generate AI editorial content
        if: ${{ !inputs.skip_enrich }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }}"
          if [ "${{ inputs.skip_existing }}" = "true" ]; then
            CMD="$CMD --skip-existing"
          fi
          if [ -n "${{ inputs.only_category }}" ]; then
            CMD="$CMD --only '${{ inputs.only_category }}'"
          fi
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          echo "CMD=$CMD"
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # ── Sync du menu Outils ───────────────────────────────────────────
      # Lit platform/sites/<site>/outils.json et met à jour
      # platform/sites/<site>/config.yaml > site.outils_menu pour refléter
      # les outils actifs. Doit tourner AVANT generate.py pour que le
      # rendu Jinja2 voie la valeur à jour.
      - name: Sync outils_menu (config.yaml ← outils.json)
        run: python platform/scripts/_sync_outils_menu.py ${{ inputs.site }}

      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}
      - name: Remove SCPI pages from classement sites
        # Ce step nettoyait toutes les `avis-*.html` quand le site est un
        # classement (héritage du template SCPI). PROBLÈME : il effaçait aussi
        # les pages de vrais avis publiés via posts_avis/.
        # Le nettoyage est désormais géré par generate.py lui-même qui :
        #   1. écrase les pages legacy `avis-<slug-produit>.html` avec un 404
        #   2. PRÉSERVE les pages dont le `<slug>` correspond à un .md de
        #      posts_avis/ (= les vrais avis du nouveau système).
        run: |
          OUTPUT="platform/sites/${{ inputs.site }}/output"
          AVIS_DIR="platform/sites/${{ inputs.site }}/posts_avis"
          PROTECTED=""
          if [ -d "$AVIS_DIR" ]; then
            for md in "$AVIS_DIR"/*.md; do
              [ -e "$md" ] || continue
              stem=$(basename "$md" .md)
              PROTECTED="$PROTECTED $stem"
            done
          fi
          echo "🛡 Avis protégés du nettoyage : $PROTECTED"
          if ls $OUTPUT/meilleur-*.html >/dev/null 2>&1; then
            rm -f $OUTPUT/comparatifs-scpi.html
            rm -f $OUTPUT/avis-scpi.html
            echo "✓ Pages SCPI résiduelles supprimées (avis individuels préservés)"
          fi

      # ── Génération des pages d'outils interactifs ─────────────────────
      # Lit platform/sites/<site>/outils.json et publie une page HTML par
      # outil "active":true dans output/<slug>.html. Script autonome :
      # ne touche pas à generate.py (limite les risques de régression).
      # S'exécute APRÈS generate.py (les pages outils ne risquent pas
      # d'être supprimées par le cleanup ci-dessus) et AVANT le commit +
      # deploy Cloudflare (les pages sont publiées avec le reste).
      - name: Generate tools pages
        run: python platform/scripts/_outils.py ${{ inputs.site }}

      # ── ① Création du fichier de vérification IndexNow ────────────────
      # IndexNow vérifie la possession du domaine en fetchant en HTTPS le
      # fichier <key>.txt à la racine du site. Comme output/ est servi
      # par Cloudflare Pages, on crée le fichier ici avant le deploy.
      - name: Create IndexNow verification file
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          KEY_FILE="platform/sites/${{ inputs.site }}/output/${INDEXNOW_KEY}.txt"
          echo "$INDEXNOW_KEY" > "$KEY_FILE"
          echo "✓ Fichier de vérification créé : ${INDEXNOW_KEY:0:8}...txt"

      # ── Commit des fichiers générés AVEC RETRY LOOP ───────────────────
      # Quand "Tout déployer" lance plusieurs workflows en parallèle, leurs
      # pushes peuvent se rejeter mutuellement ("fetch first"). On boucle :
      # fetch + rebase + push, avec backoff aléatoire pour éviter que tous
      # les workflows retrient simultanément. Max 8 tentatives sur ~2 min.
      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ Pas de changement à commit"
            exit 0
          fi
          git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"

          MAX_ATTEMPTS=8
          attempt=0
          while [ $attempt -lt $MAX_ATTEMPTS ]; do
            attempt=$((attempt + 1))
            echo ""
            echo "─── Push tentative $attempt/$MAX_ATTEMPTS ───"

            # Rebase sur la dernière version de main
            git fetch origin main
            if ! git rebase -X theirs --autostash origin/main; then
              echo "⚠ Conflit de rebase, abort"
              git rebase --abort 2>/dev/null || true
              # Conflit non auto-résolvable, on tente quand même un retry après pause
              SLEEP=$((RANDOM % 12 + 6))
              echo "⏳ Pause ${SLEEP}s avant nouveau cycle"
              sleep $SLEEP
              continue
            fi

            # Push
            if git push origin HEAD:main; then
              echo "✅ Push réussi (tentative $attempt)"
              exit 0
            fi

            # Push rejeté : un autre workflow a pushé entre notre rebase et notre push.
            # Backoff aléatoire entre 5 et 16s pour désynchroniser les retries
            # des workflows concurrents.
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              SLEEP=$((RANDOM % 12 + 5))
              echo "⚠ Push rejeté, retry dans ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

          echo "❌ Push échoué après $MAX_ATTEMPTS tentatives"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          PROJECT="${{ inputs.site }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/$PROJECT")
          if [ "$STATUS" = "404" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects"
            sleep 3
          fi
          npm install -g wrangler
          wrangler pages deploy platform/sites/${{ inputs.site }}/output \
            --project-name=$PROJECT \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Setup domains and redirects
        run: |
          python3 platform/scripts/setup_domain.py \
            ${{ inputs.site }} \
            ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} \
            ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ── ② Soumission à IndexNow ───────────────────────────────────────
      # Le site est déployé sur Cloudflare et le fichier <key>.txt est
      # accessible. On attend 10s pour que Cloudflare propage les nouvelles
      # pages, puis on soumet UNIQUEMENT les URLs nouvelles ou modifiées
      # (option "Toutes la 1ère fois, ensuite seulement les modifiées").
      # Effet de bord : platform/sites/<site>/indexation.json est mis à jour.
      - name: Submit URLs to IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          echo "⏳ Attente 10s pour propagation Cloudflare..."
          sleep 10
          python platform/scripts/submit_indexnow.py --site ${{ inputs.site }}

      # ── ③ Commit du fichier indexation.json (avec retry loop) ─────────
      # Identique à "Commit generated files" mais NON BLOQUANT : si le push
      # final foire, on n'échoue pas le workflow (le déploiement Cloudflare
      # est déjà réussi, indexation.json sera rattrapé au prochain run).
      - name: Commit indexation.json
        if: ${{ always() && env.INDEXNOW_KEY != '' }}
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git add "platform/sites/${{ inputs.site }}/indexation.json" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ Pas de mise à jour indexation.json à commit"
            exit 0
          fi
          git commit -m "IndexNow: statut indexation ${{ inputs.site }}"

          MAX_ATTEMPTS=5
          attempt=0
          while [ $attempt -lt $MAX_ATTEMPTS ]; do
            attempt=$((attempt + 1))
            echo "─── Push indexation tentative $attempt/$MAX_ATTEMPTS ───"

            git fetch origin main
            if ! git rebase -X theirs --autostash origin/main; then
              git rebase --abort 2>/dev/null || true
              SLEEP=$((RANDOM % 10 + 5))
              echo "⏳ Pause ${SLEEP}s avant retry"
              sleep $SLEEP
              continue
            fi

            if git push origin HEAD:main; then
              echo "✅ Push indexation réussi (tentative $attempt)"
              exit 0
            fi

            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              SLEEP=$((RANDOM % 10 + 5))
              echo "⚠ Push indexation rejeté, retry dans ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

          # NON BLOQUANT : on log un warning mais on n'échoue pas
          echo "⚠ Push indexation.json échoué après $MAX_ATTEMPTS tentatives (non bloquant)"
          exit 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
