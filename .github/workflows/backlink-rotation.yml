name: Backlink rotation — rebuild périodique

on:
  schedule:
    - cron: '0 6 * * 1'     # tous les lundis à 06:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild des sites avec comparatifs (rotation globale activée)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, subprocess
          from pathlib import Path
          st = Path("platform/backlink-settings.json")
          if not st.exists():
              print("Pas de backlink-settings.json"); raise SystemExit(0)
          settings = json.loads(st.read_text(encoding="utf-8"))
          if not settings.get("enabled"):
              print("Rotation désactivée"); raise SystemExit(0)
          excluded = set(settings.get("excluded_sites", []))
          sites = []
          for p in sorted(Path("platform/sites").iterdir()):
              if not p.is_dir() or p.name == "_shared" or p.name in excluded:
                  continue
              cfg = p / "config.yaml"
              # ne relancer que les sites ayant un template de classement (comparatifs)
              if cfg.exists() and "classement" in cfg.read_text(errors="ignore"):
                  sites.append(p.name)
          if not sites:
              print("Aucun site avec comparatifs."); raise SystemExit(0)
          print(f"{len(sites)} site(s) à rebuild :", sites)
          for s in sites:
              subprocess.run([
                  "gh","workflow","run","generate-site.yml",
                  "-f",f"site={s}","-f","skip_enrich=true"
              ], check=False)
          PY
