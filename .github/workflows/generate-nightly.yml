name: Nightly Site Generation

on:
  workflow_dispatch:      # Déclenchement manuel possible aussi

jobs:
  generate-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jinja2 requests

      - name: Find and process pending sites
        run: |
          python3 << 'PYEOF'
          import json, subprocess, sys
          from pathlib import Path

          hub_path = Path("hub.config.json")
          if not hub_path.exists():
              print("Aucun hub.config.json trouvé")
              sys.exit(0)

          with open(hub_path) as f:
              hub = json.load(f)

          pending = [s for s in hub.get("sites", [])
                     if s.get("status") in ("building", "pending_generation", "generation_incomplete")]

          if not pending:
              print("Aucun site en attente de génération")
              sys.exit(0)

          print(f"{len(pending)} site(s) à traiter : {[s['id'] for s in pending]}")

          for site in pending:
              site_id = site["id"]
              print(f"\n{'='*50}")
              print(f"Traitement : {site_id}")

              # Lance enrich_editorial avec skip-existing (retente seulement les manquants)
              result = subprocess.run(
                  ["python3", "platform/scripts/enrich_editorial.py",
                   "--site", site_id, "--skip-existing"],
                  capture_output=False
              )

              # Vérifie si tout est complet
              status_file = Path(f"platform/sites/{site_id}/generation_status.json")
              if status_file.exists():
                  with open(status_file) as f:
                      status = json.load(f)
                  pairs_ok = status.get("pairs_complete", False)
                  products_ok = status.get("products_complete", False)
                  site_ok = Path(f"platform/sites/{site_id}/site_editorial.json").exists()

                  if pairs_ok and products_ok and site_ok:
                      print(f"✅ {site_id} : génération complète → lancement du build")
                      # Lance le build et le deploy
                      subprocess.run(
                          ["python3", "platform/scripts/generate.py", "--site", site_id]
                      )
                      # Met à jour le statut dans hub.config.json
                      for s in hub["sites"]:
                          if s["id"] == site_id:
                              s["status"] = "deploying"
                              break
                  else:
                      done_pairs = status.get("pairs_done", 0)
                      total_pairs = status.get("pairs_total", 45)
                      print(f"⏳ {site_id} : {done_pairs}/{total_pairs} paires — sera retenté demain")
                      for s in hub["sites"]:
                          if s["id"] == site_id:
                              s["status"] = "generation_incomplete"
                              s["generation_progress"] = f"{done_pairs}/{total_pairs}"
                              break

          # Sauvegarde hub.config.json mis à jour
          with open(hub_path, "w") as f:
              json.dump(hub, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add -A
          git diff --cached --quiet || git commit -m "Nightly generation [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy completed sites
        run: |
          python3 << 'PYEOF'
          import json, subprocess
          from pathlib import Path

          hub_path = Path("hub.config.json")
          with open(hub_path) as f:
              hub = json.load(f)

          to_deploy = [s for s in hub.get("sites", []) if s.get("status") == "deploying"]

          for site in to_deploy:
              site_id = site["id"]
              output_dir = f"platform/sites/{site_id}/output"

              if not Path(output_dir).exists():
                  print(f"⚠ Pas d'output pour {site_id}")
                  continue

              print(f"Deploy {site_id}...")
              # Le deploy est fait via wrangler dans le step suivant
              print(f"✅ {site_id} prêt pour deploy")
          PYEOF

      - name: Deploy to Cloudflare Pages
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os
          from pathlib import Path

          hub_path = Path("hub.config.json")
          with open(hub_path) as f:
              hub = json.load(f)

          to_deploy = [s for s in hub.get("sites", []) if s.get("status") == "deploying"]
          if not to_deploy:
              print("Aucun site à déployer")
              exit(0)

          account_id = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          api_token = os.environ["CLOUDFLARE_API_TOKEN"]

          for site in to_deploy:
              site_id = site["id"]
              output_dir = f"platform/sites/{site_id}/output"
              if not Path(output_dir).exists():
                  continue

              print(f"Deploy {site_id} → Cloudflare Pages...")
              subprocess.run([
                  "npx", "wrangler", "pages", "deploy", output_dir,
                  f"--project-name={site_id}",
                  "--branch=main",
                  "--commit-dirty=true"
              ], env={**os.environ, "CLOUDFLARE_API_TOKEN": api_token, "CLOUDFLARE_ACCOUNT_ID": account_id})
              # Association domaines custom
              try:
                  import yaml
                  with open(f"platform/sites/{site_id}/config.yaml") as cf:
                      scfg = yaml.safe_load(cf)
                  raw_domain = scfg.get("site", {}).get("domain", "")
                  raw_domain = raw_domain.replace("https://www.", "").replace("https://", "").replace("http://", "").strip("/")
                  if raw_domain:
                      for variant in [raw_domain, f"www.{raw_domain}"]:
                          r = subprocess.run([
                              "curl", "-s", "-X", "POST",
                              "-H", f"Authorization: Bearer {api_token}",
                              "-H", "Content-Type: application/json",
                              "-d", json.dumps({"name": variant}),
                              f"https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{site_id}/domains"
                          ], capture_output=True, text=True)
                          result = json.loads(r.stdout)
                          if result.get("success"):
                              print(f"  ✓ Domaine associé : {variant}")
                          elif any(e.get("code") == 8000037 for e in result.get("errors", [])):
                              print(f"  ✓ Domaine déjà associé : {variant}")
              except Exception as de:
                  print(f"  ⚠ Domaine : {de}")

              # Règle de redirection naked → www (ou www → naked)
              try:
                  www_pref = scfg.get("site", {}).get("www_preference", "www") if 'scfg' in dir() else "www"
                  zone_r = subprocess.run([
                      "curl", "-s",
                      "-H", f"Authorization: Bearer {api_token}",
                      f"https://api.cloudflare.com/client/v4/zones?name={raw_domain}"
                  ], capture_output=True, text=True)
                  zone_data = json.loads(zone_r.stdout)
                  zones = zone_data.get("result", [])
                  if zones:
                      zone_id = zones[0]["id"]
                      if www_pref == "www":
                          src = f"https://{raw_domain}/*"
                          dst = f"https://www.{raw_domain}/$1"
                      else:
                          src = f"https://www.{raw_domain}/*"
                          dst = f"https://{raw_domain}/$1"
                      rule_payload = {
                          "rules": [{
                              "description": "www redirect",
                              "expression": f'(http.host eq "{raw_domain if www_pref == "www" else "www." + raw_domain}")',
                              "action": "redirect",
                              "action_parameters": {
                                  "from_value": {
                                      "status_code": 301,
                                      "target_url": {
                                          "expression": f'concat("https://{"www." if www_pref == "www" else ""}{raw_domain}", http.request.uri.path)'
                                      },
                                      "preserve_query_string": True
                                  }
                              },
                              "enabled": True
                          }]
                      }
                      rr = subprocess.run([
                          "curl", "-s", "-X", "PUT",
                          "-H", f"Authorization: Bearer {api_token}",
                          "-H", "Content-Type: application/json",
                          "-d", json.dumps(rule_payload),
                          f"https://api.cloudflare.com/client/v4/zones/{zone_id}/rulesets/phases/http_request_redirect/entrypoint"
                      ], capture_output=True, text=True)
                      rr_data = json.loads(rr.stdout)
                      if rr_data.get("success"):
                          print(f"  ✓ Règle 301 créée : {raw_domain} → {'www.' if www_pref == 'www' else ''}{raw_domain}")
                      else:
                          print(f"  ⚠ Règle 301 : {rr_data.get('errors', '')}")
              except Exception as re:
                  print(f"  ⚠ Redirect rule : {re}")

              # Met à jour le statut
              for s in hub["sites"]:
                  if s["id"] == site_id:
                      s["status"] = "live"
                      from datetime import datetime
                      s["last_deployed"] = datetime.now().isoformat()
                      break

          with open(hub_path, "w") as f:
              json.dump(hub, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Final commit with deploy status
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add hub.config.json
          git diff --cached --quiet || git commit -m "Deploy status update [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
