name: Generate Site

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site slug (ex: scpi, comparateur-scpi)'
        required: true
        type: string
      skip_enrich:
        description: 'Sauter la génération IA (utilise les textes déjà générés)'
        required: false
        type: boolean
        default: false
      schedule:
        description: 'Heure de lancement HH:MM UTC (ex: 01:00 = 3h du matin France)'
        required: false
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jinja2 requests

      - name: Generate AI editorial content
        if: ${{ inputs.skip_enrich == false }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }} --skip-existing"
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}

      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/${{ inputs.site }}/
          git diff --cached --quiet || git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          PROJECT="${{ inputs.site }}"

          # Crée le projet si il n'existe pas
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT")

          if [ "$STATUS" = "404" ]; then
            echo "Création du projet Cloudflare Pages..."
            curl -s -X POST \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects"
            sleep 3
          fi

          # Deploy via wrangler
          npm install -g wrangler
          wrangler pages deploy platform/sites/${{ inputs.site }}/output \
            --project-name=$PROJECT \
            --branch=main \
            --commit-dirty=true
          # Association automatique des domaines custom (www + naked)
          DOMAIN=$(python3 -c "
import yaml, sys
try:
    with open('platform/sites/${{ inputs.site }}/config.yaml') as f:
        cfg = yaml.safe_load(f)
    d = cfg.get('site', {}).get('domain', '')
    d = d.replace('https://www.', '').replace('https://', '').replace('http://', '').strip('/')
    print(d) if d else sys.exit(0)
except: sys.exit(0)
" 2>/dev/null || true)

          if [ -n "$DOMAIN" ]; then
            for VARIANT in "$DOMAIN" "www.$DOMAIN"; do
              RESULT=$(curl -s -X POST \
                -H "Authorization: Bearer $API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"name\":\"$VARIANT\"}" \
                "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/domains")
              SUCCESS=$(echo $RESULT | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('success','false'))" 2>/dev/null)
              CODE=$(echo $RESULT | python3 -c "import sys,json; d=json.load(sys.stdin); errs=d.get('errors',[]); print(errs[0].get('code',0) if errs else 0)" 2>/dev/null)
              if [ "$SUCCESS" = "True" ]; then
                echo "✓ Domaine associé : $VARIANT"
              elif [ "$CODE" = "8000037" ]; then
                echo "✓ Domaine déjà associé : $VARIANT"
              else
                echo "⚠ Info domaine $VARIANT : $RESULT"
              fi
            done
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
