name: Generate Site

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site slug (ex: scpi, comparateur-scpi)'
        required: true
        type: string
      skip_enrich:
        description: 'Sauter la génération IA (utilise les textes déjà générés)'
        required: false
        type: boolean
        default: false
      schedule:
        description: 'Heure de lancement HH:MM UTC (ex: 01:00 = 3h du matin France)'
        required: false
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jinja2 requests

      - name: Generate AI editorial content
        if: ${{ inputs.skip_enrich == false }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }} --skip-existing"
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}

      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/${{ inputs.site }}/
          git diff --cached --quiet || git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          PROJECT="${{ inputs.site }}"
          OUTPUT_DIR="platform/sites/${{ inputs.site }}/output"

          # Crée le projet si il n'existe pas
          echo "Vérification du projet Cloudflare Pages..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT")

          if [ "$STATUS" = "404" ]; then
            echo "Projet inexistant, création..."
            curl -s -X POST \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects"
            echo "Projet créé."
            sleep 3
          else
            echo "Projet existant."
          fi

          # Upload via Direct Upload API
          cd $OUTPUT_DIR
          echo "Upload des fichiers..."

          # Crée un déploiement Direct Upload
          DEPLOY=$(curl -s -X POST \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/deployments")

          DEPLOY_ID=$(echo $DEPLOY | python3 -c "import sys,json; print(json.load(sys.stdin)['result']['id'])")
          echo "Déploiement ID: $DEPLOY_ID"

          # Upload chaque fichier HTML
          for f in *.html sitemap.xml; do
            [ -f "$f" ] || continue
            MIME="text/html"
            [ "$f" = "sitemap.xml" ] && MIME="application/xml"
            curl -s -X PUT \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: $MIME" \
              --data-binary "@$f" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/deployments/$DEPLOY_ID/files/$f" > /dev/null
          done

          # Finalise le déploiement
          curl -s -X PUT \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT/deployments/$DEPLOY_ID/finalize"

          echo "✅ Deploy terminé : https://$PROJECT.pages.dev"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
