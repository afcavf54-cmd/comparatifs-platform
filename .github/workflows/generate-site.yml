name: Generate Site

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site slug (ex: scpi, comparateur-scpi)'
        required: true
        type: string
      skip_enrich:
        description: 'Sauter la génération IA (utilise les textes déjà générés)'
        required: false
        type: boolean
        default: false
      schedule:
        description: 'Heure de lancement HH:MM UTC (ex: 01:00 = 3h du matin France)'
        required: false
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # Sérialise les pushs sur main (idem generate-scpi.yml) — un seul workflow à
    # la fois pousse pour éviter `cannot lock ref 'refs/heads/main'`.
    concurrency:
      group: deploy-push-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jinja2 requests

      - name: Generate AI editorial content
        if: ${{ inputs.skip_enrich == false }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }} --skip-existing"
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}

      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/${{ inputs.site }}/
          if git diff --cached --quiet; then
            echo "Rien à commit, on saute le push"
            exit 0
          fi
          git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"
          # ── Retry loop (5 tentatives) ─────────────────────────────────────
          # Filet de sécurité contre les pushs concurrents (cf generate-scpi.yml).
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "❌ Rebase impossible — abandon"
              exit 1
            fi
            if git push 2>&1 | tee /tmp/push.log; then
              echo "✓ Push réussi (tentative $attempt)"
              exit 0
            fi
            echo "⚠ Push rejeté (tentative $attempt) :"
            cat /tmp/push.log
            sleep $((attempt * 5))
          done
          echo "❌ Push échoué après 5 tentatives"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          PROJECT="${{ inputs.site }}"

          # Crée le projet si il n'existe pas
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT")

          if [ "$STATUS" = "404" ]; then
            echo "Création du projet Cloudflare Pages..."
            curl -s -X POST \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects"
            sleep 3
          fi

          # Deploy via wrangler
          npm install -g wrangler
          wrangler pages deploy platform/sites/${{ inputs.site }}/output \
            --project-name=$PROJECT \
            --branch=main \
            --commit-dirty=true
          # Association domaines + règle 301
          python3 platform/scripts/setup_domain.py ${{ inputs.site }} $ACCOUNT_ID $API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
