name: Generate Site

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site slug (ex: scpi, comparateur-scpi)'
        required: true
        type: string
      skip_enrich:
        description: 'Sauter la génération IA (utilise les textes déjà générés)'
        required: false
        type: boolean
        default: false
      schedule:
        description: 'Heure de lancement HH:MM UTC (ex: 01:00 = 3h du matin France)'
        required: false
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jinja2 requests

      - name: Generate AI editorial content
        if: ${{ inputs.skip_enrich == false }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }} --skip-existing"
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}

      - name: Commit generated files
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/${{ inputs.site }}/
          git diff --cached --quiet || git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ inputs.site }}
          directory: platform/sites/${{ inputs.site }}/output
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
