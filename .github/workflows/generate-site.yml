name: Generate Site
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site slug (ex: scpi, comparateur-scpi)'
        required: true
        type: string
      skip_enrich:
        description: 'Sauter la génération IA (utilise les textes déjà générés)'
        required: false
        type: boolean
        default: false
      schedule:
        description: 'Heure de lancement HH:MM UTC (ex: 01:00 = 3h du matin France)'
        required: false
        type: string
        default: ''
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ── Env au niveau du JOB ─────────────────────────────────────────────
    # INDEXNOW_KEY doit être ici (pas dans un step) pour être accessible
    # dans les conditions `if:` des steps. Sinon les steps qui dépendent
    # de cette variable sont skipped silencieusement.
    env:
      TZ: 'Europe/Paris'
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml jinja2 requests
      - name: Generate AI editorial content
        if: ${{ inputs.skip_enrich == false }}
        run: |
          CMD="python platform/scripts/enrich_editorial.py --site ${{ inputs.site }} --skip-existing"
          if [ -n "${{ inputs.schedule }}" ]; then
            CMD="$CMD --schedule ${{ inputs.schedule }}"
          fi
          $CMD
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Generate static site
        run: python platform/scripts/generate.py --site ${{ inputs.site }}

      # ── ① Création du fichier de vérification IndexNow ────────────────
      # IndexNow vérifie la possession du domaine en fetchant en HTTPS le
      # fichier <key>.txt à la racine du site. Comme output/ est servi
      # par Cloudflare Pages, on crée le fichier ici avant le deploy.
      - name: Create IndexNow verification file
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          KEY_FILE="platform/sites/${{ inputs.site }}/output/${INDEXNOW_KEY}.txt"
          echo "$INDEXNOW_KEY" > "$KEY_FILE"
          echo "✓ Fichier de vérification créé : ${INDEXNOW_KEY:0:8}...txt"

      - name: Commit generated files (with push retry)
        # ── Retry loop contre les collisions de push concurrent ──────────
        # Bug d'origine observé en mai 2026 : quand plusieurs déploiements
        # tournent en parallèle (cas normal du HUB Viseoweb), le 2e workflow
        # voit son push rejeté avec "cannot lock ref 'refs/heads/main'".
        # On enchaîne fetch + rebase + push jusqu'à 5 fois avec backoff
        # progressif (2s, 4s, 6s, 8s, 10s). Au-delà → erreur fatale.
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # On stage TOUT le build : generate.py écrit aussi hors du dossier du
          # site (editorial/dates partagés). Ne stager que platform/sites/<site>/
          # laissait ces fichiers non stagés → `git rebase` échouait avec
          # "cannot rebase: You have unstaged changes".
          git add -A

          if git diff --cached --quiet; then
            echo "ℹ Aucun changement à commiter — push skip"
            exit 0
          fi

          git commit -m "Generated: ${{ inputs.site }} [$(date +%Y-%m-%d)]"

          PUSH_OK=0
          for i in 1 2 3 4 5; do
            echo "→ Push tentative $i/5..."
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              echo "  ⚠ Rebase a échoué (conflits ?), abort et retry"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo "  ✓ Push réussi (tentative $i/5)"
              PUSH_OK=1
              break
            fi
            echo "  ⚠ Push collision (tentative $i/5), retry dans $((i * 2))s..."
            sleep $((i * 2))
          done

          if [ "$PUSH_OK" != "1" ]; then
            echo "❌ Push échoué après 5 tentatives — main est trop disputé"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloudflare Pages
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          API_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          PROJECT="${{ inputs.site }}"
          # Crée le projet si il n'existe pas
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects/$PROJECT")
          if [ "$STATUS" = "404" ]; then
            echo "Création du projet Cloudflare Pages..."
            curl -s -X POST \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/pages/projects"
            sleep 3
          fi
          # Deploy via wrangler
          npm install -g wrangler
          wrangler pages deploy platform/sites/${{ inputs.site }}/output \
            --project-name=$PROJECT \
            --branch=main \
            --commit-dirty=true
          # Association domaines + règle 301
          python3 platform/scripts/setup_domain.py ${{ inputs.site }} $ACCOUNT_ID $API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # ── ② Soumission à IndexNow ───────────────────────────────────────
      # Le site est déployé sur Cloudflare et le fichier <key>.txt est
      # accessible. On attend 10s pour que Cloudflare propage les nouvelles
      # pages, puis on soumet TOUTES les URLs du sitemap.xml.
      # Effet de bord : platform/sites/<site>/indexation.json est mis à jour
      # avec le statut HTTP par URL (utilisé par l'onglet Indexation du HUB).
      - name: Submit URLs to IndexNow
        if: ${{ env.INDEXNOW_KEY != '' }}
        run: |
          echo "⏳ Attente 10s pour propagation Cloudflare..."
          sleep 10
          python platform/scripts/submit_indexnow.py --site ${{ inputs.site }}

      # ── ③ Commit du fichier indexation.json (avec retry) ──────────────
      # On commit séparément car indexation.json est modifié APRÈS le commit
      # principal du build. Échec non bloquant : si le push final foire, on
      # ne fait pas planter le workflow (le déploiement Cloudflare a réussi).
      - name: Commit indexation.json (with retry)
        if: ${{ always() && env.INDEXNOW_KEY != '' }}
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git add "platform/sites/${{ inputs.site }}/indexation.json" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "ℹ Pas de mise à jour indexation.json à commit"
            exit 0
          fi

          git commit -m "IndexNow: statut indexation ${{ inputs.site }}"

          PUSH_OK=0
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort 2>/dev/null || true
              sleep $((i * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo "✓ Push indexation.json réussi (tentative $i/5)"
              PUSH_OK=1
              break
            fi
            sleep $((i * 2))
          done

          if [ "$PUSH_OK" != "1" ]; then
            echo "⚠ Push indexation.json échoué après 5 tentatives (non bloquant)"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
