name: Blog cron — publication articles programmés
on:
  schedule:
    # Toutes les heures à HH:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Limiter à un site (vide = tous)'
        required: false
        type: string
        default: ''
      force_titles:
        description: "Titres à forcer (séparés par '|', ignore la date programmée)"
        required: false
        type: string
        default: ''

# Concurrency group AU NIVEAU DU WORKFLOW (et non du job).
#
# Pourquoi au niveau workflow plutôt que job : GitHub Actions garantit qu'un
# seul run du workflow tourne en même temps avec cette config. Avec un
# concurrency au niveau du job, dans certains edge cases (notamment quand un
# workflow_dispatch arrive très proche d'un trigger schedule), 2 runs peuvent
# se chevaucher et créer des doublons d'articles (slugs avec préfixes random
# différents, rebase sans conflit côté Git → 2 fichiers .md publiés).
#
# Pourquoi pas partagé avec deploy-push-main : GitHub Actions n'autorise QU'UN
# seul job en queue par concurrency group. Si plusieurs pushs sur main arrivent
# pendant que le blog-cron attend, le blog-cron serait CANCELLED. Les conflits
# de push sont gérés ailleurs (boucle de retry avec git fetch + rebase + push).
concurrency:
  group: blog-cron-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: 'Europe/Paris'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # pillow + piexif : utilisés par _image_generator.py pour la conversion
        # PNG -> JPG compressee + injection des EXIF "photo prise a Paris".
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow piexif requests
      - name: Publier les articles programmés
        id: publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_TITLES: ${{ inputs.force_titles }}
        run: python platform/scripts/blog_publish_scheduled.py

      # Publication des avis programmés (template avis-post). Indépendant du
      # blog : utilise sa propre sheet (config.yaml > site.avis_sheet_csv_url),
      # son propre dossier posts_avis/, son propre suivi schedule_processed.json.
      # On combine les sites à redéployer des 2 scripts via SITES_TO_DEPLOY_BLOG
      # + SITES_TO_DEPLOY_AVIS pour ne lancer qu'un seul deploy par site.
      - name: Publier les avis programmés
        id: publish_avis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_TITLES: ${{ inputs.force_titles }}
        run: |
          if [ -f platform/scripts/avis_publish_scheduled.py ]; then
            python platform/scripts/avis_publish_scheduled.py
          else
            echo "avis_publish_scheduled.py non trouvé, étape ignorée"
            echo "sites_to_deploy=" >> $GITHUB_OUTPUT
          fi

      # Combine les sites à redéployer (blog + avis) en une liste dédupliquée
      - name: Combiner les sites à redéployer
        id: combine
        run: |
          BLOG="${{ steps.publish.outputs.sites_to_deploy }}"
          AVIS="${{ steps.publish_avis.outputs.sites_to_deploy }}"
          ALL=$(echo "$BLOG,$AVIS" | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "sites_to_deploy=$ALL" >> $GITHUB_OUTPUT
          echo "Sites à redéployer (blog + avis combinés) : $ALL"
      - name: Commit les nouveaux articles et avis
        if: steps.combine.outputs.sites_to_deploy != ''
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          # Stage TOUT (le build peut écrire hors de platform/sites/ : editorial,
          # dates…). Ne stager que platform/sites/ laissait des fichiers non
          # stagés → "cannot rebase: You have unstaged changes". (.gitignore
          # exclut les .pyc.)
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à commit"
            exit 0
          fi
          git commit -m "Cron: publication blog/avis $(date +%Y-%m-%d-%H:%M)"
          # Retry loop (cf generate-scpi.yml) — gère les conflits de push concurrent
          # depuis d'autres workflows. C'est cette boucle qui dispense le blog-cron
          # de partager un concurrency group avec deploy-push-main.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs --autostash origin/main; then
              git rebase --abort || true
              echo "❌ Rebase impossible — abandon"
              exit 1
            fi
            if git push 2>&1 | tee /tmp/push.log; then
              echo "✓ Push réussi (tentative $attempt)"
              exit 0
            fi
            echo "⚠ Push rejeté (tentative $attempt), retry..."
            sleep $((attempt * 5))
          done
          echo "❌ Push échoué après 5 tentatives"
          exit 1
      - name: Déclencher le redéploiement des sites concernés
        if: steps.combine.outputs.sites_to_deploy != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra SITES <<< "${{ steps.combine.outputs.sites_to_deploy }}"
          for site in "${SITES[@]}"; do
            echo "🚀 Déclenchement du déploiement pour $site"
            gh workflow run generate-scpi.yml \
              -f site="$site" \
              -f skip_enrich=true || echo "⚠ Échec déclenchement $site (le déploiement peut être lancé manuellement)"
          done
      # ── Comparateurs en masse (rythme de publication) ───────────────────
      # Plus de dates : on repère les sites dont le Sheet contient au moins un
      # comparateur non encore rédigé. Contrairement au blog/avis (contenu
      # écrit directement → skip_enrich=true), les comparateurs sont produits
      # par build_comparators pendant le build → skip_enrich=false. Le mode
      # comparators_daily=true fait rédiger N au hasard (rythme du site).
      # Le cron tourne toutes les heures (pour le blog/avis). Mais le rythme des
      # comparateurs est PAR JOUR : on ne déclenche leur rédaction qu'UNE fois
      # par jour, à 05h UTC (07h Paris). Sinon « 2/jour » deviendrait « 2 par
      # passage horaire ». Changer COMPARATORS_HOUR pour décaler l'heure.
      - name: Comparateurs — détection des non rédigés (1×/jour)
        id: detect_comparators
        env:
          COMPARATORS_HOUR: "05"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rythme PAR JOUR. Le cron GitHub (0 * * * *) est souvent RETARDÉ : le
          # run « de 05:00 UTC » arrive parfois à 05:40, voire 06:xx. L'ancien
          # test d'heure EXACTE (== 05) ratait alors la journée ENTIÈRE (aucun
          # comparateur rédigé ce jour-là).
          # Nouveau gate robuste : on déclenche au PREMIER passage de la journée
          # à partir de l'heure cible, puis on marque le jour comme traité via un
          # fichier committé → les passages horaires suivants ne re-déclenchent
          # pas. Un seul déclenchement par jour UTC, insensible aux retards.
          HOUR=$(date -u +%H)
          TODAY=$(date -u +%Y-%m-%d)
          STATE="platform/.comparators_last_run"
          LAST="$(cat "$STATE" 2>/dev/null || true)"
          if [ "$((10#$HOUR))" -lt "$((10#$COMPARATORS_HOUR))" ]; then
            echo "⏭ Avant ${COMPARATORS_HOUR}h UTC (il est ${HOUR}h) — on saute."
            exit 0
          fi
          if [ "$LAST" = "$TODAY" ]; then
            echo "⏭ Comparateurs déjà déclenchés aujourd'hui ($TODAY) — on saute."
            exit 0
          fi
          python platform/scripts/comparators_cron.py
          # Marque le jour comme traité et le persiste (commit + push) pour que
          # les runs horaires suivants voient que c'est fait. [skip ci] : ce
          # commit ne doit déclencher aucun autre workflow.
          echo "$TODAY" > "$STATE"
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          git add "$STATE"
          if ! git diff --cached --quiet; then
            git commit -m "Cron comparateurs : marqueur quotidien $TODAY [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase -X theirs --autostash origin/main; then
                git rebase --abort || true
                echo "⚠ rebase marqueur impossible — abandon du marqueur"
                break
              fi
              if git push; then echo "✓ marqueur quotidien poussé"; break; fi
              echo "⚠ push marqueur rejeté (tentative $attempt), retry..."
              sleep $((attempt * 5))
            done
          fi
      - name: Comparateurs — déclenchement du build (rythme quotidien)
        if: steps.detect_comparators.outputs.sites_to_deploy != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra SITES <<< "${{ steps.detect_comparators.outputs.sites_to_deploy }}"
          for site in "${SITES[@]}"; do
            [ -z "$site" ] && continue
            echo "🚀 Comparateurs à rédiger → build $site (rythme quotidien)"
            gh workflow run generate-scpi.yml \
              -f site="$site" \
              -f skip_enrich=false \
              -f skip_existing=true \
              -f comparators_daily=true || echo "⚠ Échec déclenchement $site"
            sleep 5
          done

      - name: Résumé
        if: always()
        run: |
          echo "=== Cron blog/avis/comparateurs terminé ==="
          echo "Blog : ${{ steps.publish.outputs.sites_to_deploy }}"
          echo "Avis : ${{ steps.publish_avis.outputs.sites_to_deploy }}"
          echo "Tous blog/avis (dédupliqués) : ${{ steps.combine.outputs.sites_to_deploy }}"
          echo "Comparateurs : ${{ steps.detect_comparators.outputs.sites_to_deploy }}"
