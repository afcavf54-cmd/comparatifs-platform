name: Blog cron — publication articles programmés

on:
  schedule:
    # Toutes les heures à HH:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Limiter à un site (vide = tous)'
        required: false
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Sérialise avec les autres workflows (generate-scpi, generate-site)
    # pour éviter les courses de push sur main.
    concurrency:
      group: deploy-push-main
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Publier les articles programmés
        id: publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python platform/scripts/blog_publish_scheduled.py

      - name: Commit les nouveaux articles
        if: steps.publish.outputs.new_articles_count != '0'
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/
          if git diff --cached --quiet; then
            echo "Rien à commit"
            exit 0
          fi
          git commit -m "Blog cron: publication automatique $(date +%Y-%m-%d-%H:%M)"
          # Retry loop (cf generate-scpi.yml)
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "❌ Rebase impossible — abandon"
              exit 1
            fi
            if git push 2>&1 | tee /tmp/push.log; then
              echo "✓ Push réussi (tentative $attempt)"
              exit 0
            fi
            echo "⚠ Push rejeté (tentative $attempt), retry..."
            sleep $((attempt * 5))
          done
          echo "❌ Push échoué après 5 tentatives"
          exit 1

      - name: Déclencher le redéploiement des sites concernés
        if: steps.publish.outputs.sites_to_deploy != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra SITES <<< "${{ steps.publish.outputs.sites_to_deploy }}"
          for site in "${SITES[@]}"; do
            echo "🚀 Déclenchement du déploiement pour $site"
            gh workflow run generate-scpi.yml \
              -f site="$site" \
              -f skip_enrich=true || echo "⚠ Échec déclenchement $site (le déploiement peut être lancé manuellement)"
          done

      - name: Résumé
        if: always()
        run: |
          echo "=== Blog cron terminé ==="
          echo "Sites avec articles publiés : ${{ steps.publish.outputs.sites_to_deploy }}"
          echo "Total nouveaux articles : ${{ steps.publish.outputs.new_articles_count }}"
