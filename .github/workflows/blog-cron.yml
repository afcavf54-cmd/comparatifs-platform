name: Blog cron — publication articles programmés
on:
  schedule:
    # Toutes les heures à HH:00 UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Limiter à un site (vide = tous)'
        required: false
        type: string
        default: ''
      force_titles:
        description: "Titres à forcer (séparés par '|', ignore la date programmée)"
        required: false
        type: string
        default: ''

# Concurrency group AU NIVEAU DU WORKFLOW (et non du job).
#
# Pourquoi au niveau workflow plutôt que job : GitHub Actions garantit qu'un
# seul run du workflow tourne en même temps avec cette config. Avec un
# concurrency au niveau du job, dans certains edge cases (notamment quand un
# workflow_dispatch arrive très proche d'un trigger schedule), 2 runs peuvent
# se chevaucher et créer des doublons d'articles (slugs avec préfixes random
# différents, rebase sans conflit côté Git → 2 fichiers .md publiés).
#
# Pourquoi pas partagé avec deploy-push-main : GitHub Actions n'autorise QU'UN
# seul job en queue par concurrency group. Si plusieurs pushs sur main arrivent
# pendant que le blog-cron attend, le blog-cron serait CANCELLED. Les conflits
# de push sont gérés ailleurs (boucle de retry avec git fetch + rebase + push).
concurrency:
  group: blog-cron-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: 'Europe/Paris'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # pillow + piexif : utilisés par _image_generator.py pour la conversion
        # PNG -> JPG compressee + injection des EXIF "photo prise a Paris".
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow piexif
      - name: Publier les articles programmés
        id: publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_TITLES: ${{ inputs.force_titles }}
        run: python platform/scripts/blog_publish_scheduled.py

      # Publication des avis programmés (template avis-post). Indépendant du
      # blog : utilise sa propre sheet (config.yaml > site.avis_sheet_csv_url),
      # son propre dossier posts_avis/, son propre suivi schedule_processed.json.
      # On combine les sites à redéployer des 2 scripts via SITES_TO_DEPLOY_BLOG
      # + SITES_TO_DEPLOY_AVIS pour ne lancer qu'un seul deploy par site.
      - name: Publier les avis programmés
        id: publish_avis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_TITLES: ${{ inputs.force_titles }}
        run: |
          if [ -f platform/scripts/avis_publish_scheduled.py ]; then
            python platform/scripts/avis_publish_scheduled.py
          else
            echo "avis_publish_scheduled.py non trouvé, étape ignorée"
            echo "sites_to_deploy=" >> $GITHUB_OUTPUT
          fi

      # Combine les sites à redéployer (blog + avis) en une liste dédupliquée
      - name: Combiner les sites à redéployer
        id: combine
        run: |
          BLOG="${{ steps.publish.outputs.sites_to_deploy }}"
          AVIS="${{ steps.publish_avis.outputs.sites_to_deploy }}"
          ALL=$(echo "$BLOG,$AVIS" | tr ',' '\n' | grep -v '^$' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "sites_to_deploy=$ALL" >> $GITHUB_OUTPUT
          echo "Sites à redéployer (blog + avis combinés) : $ALL"
      - name: Commit les nouveaux articles et avis
        if: steps.combine.outputs.sites_to_deploy != ''
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/
          if git diff --cached --quiet; then
            echo "Rien à commit"
            exit 0
          fi
          git commit -m "Cron: publication blog/avis $(date +%Y-%m-%d-%H:%M)"
          # Retry loop (cf generate-scpi.yml) — gère les conflits de push concurrent
          # depuis d'autres workflows. C'est cette boucle qui dispense le blog-cron
          # de partager un concurrency group avec deploy-push-main.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "❌ Rebase impossible — abandon"
              exit 1
            fi
            if git push 2>&1 | tee /tmp/push.log; then
              echo "✓ Push réussi (tentative $attempt)"
              exit 0
            fi
            echo "⚠ Push rejeté (tentative $attempt), retry..."
            sleep $((attempt * 5))
          done
          echo "❌ Push échoué après 5 tentatives"
          exit 1
      - name: Déclencher le redéploiement des sites concernés
        if: steps.combine.outputs.sites_to_deploy != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra SITES <<< "${{ steps.combine.outputs.sites_to_deploy }}"
          for site in "${SITES[@]}"; do
            echo "🚀 Déclenchement du déploiement pour $site"
            gh workflow run generate-scpi.yml \
              -f site="$site" \
              -f skip_enrich=true || echo "⚠ Échec déclenchement $site (le déploiement peut être lancé manuellement)"
          done
      - name: Résumé
        if: always()
        run: |
          echo "=== Cron blog/avis terminé ==="
          echo "Blog : ${{ steps.publish.outputs.sites_to_deploy }}"
          echo "Avis : ${{ steps.publish_avis.outputs.sites_to_deploy }}"
          echo "Tous (dédupliqués) : ${{ steps.combine.outputs.sites_to_deploy }}"
