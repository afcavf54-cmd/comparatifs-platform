name: Backfill — générer les images à la une manquantes
on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Limiter à un site (vide = tous)'
        required: false
        type: string
        default: ''
      limit:
        description: "Nombre max d'images à générer (garde-fou budget OpenAI)"
        required: false
        type: string
        default: '20'
      dry_run:
        description: 'Dry-run : juste afficher ce qui serait fait, sans appeler OpenAI'
        required: false
        type: boolean
        default: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: 'Europe/Paris'
    # Concurrency group dédié : on ne veut pas que 2 backfills tournent en
    # même temps (risque de doublons d'appel OpenAI et de conflit de push).
    concurrency:
      group: backfill-featured-images-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pillow piexif

      - name: Générer les images manquantes
        id: backfill
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE: ${{ inputs.site }}
          LIMIT: ${{ inputs.limit }}
          # En dry-run, le script ne fait aucun appel OpenAI mais affiche
          # quels articles seraient traités. Utile pour estimer le budget
          # avant le run réel.
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python platform/scripts/backfill_featured_images.py

      - name: Commit les nouvelles images
        # `!inputs.dry_run` est l'écriture qui marche pour un boolean input
        # GitHub Actions (cf. correction faite sur generate-scpi.yml).
        if: ${{ steps.backfill.outputs.sites_to_deploy != '' && !inputs.dry_run }}
        run: |
          git config user.name "Viseoweb HUB"
          git config user.email "hub@viseoweb.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add platform/sites/
          if git diff --cached --quiet; then
            echo "Rien à commit"
            exit 0
          fi
          git commit -m "Backfill: ${{ steps.backfill.outputs.images_generated }} image(s) à la une"
          # Retry loop standard (cf. blog-cron.yml)
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "❌ Rebase impossible — abandon"
              exit 1
            fi
            if git push 2>&1 | tee /tmp/push.log; then
              echo "✓ Push réussi (tentative $attempt)"
              exit 0
            fi
            echo "⚠ Push rejeté (tentative $attempt), retry..."
            sleep $((attempt * 5))
          done
          echo "❌ Push échoué après 5 tentatives"
          exit 1

      - name: Déclencher le redéploiement des sites concernés
        if: ${{ steps.backfill.outputs.sites_to_deploy != '' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IFS=',' read -ra SITES <<< "${{ steps.backfill.outputs.sites_to_deploy }}"
          for site in "${SITES[@]}"; do
            echo "🚀 Déclenchement du déploiement pour $site"
            gh workflow run generate-scpi.yml \
              -f site="$site" \
              -f skip_enrich=true || echo "⚠ Échec déclenchement $site"
          done

      - name: Résumé
        if: always()
        run: |
          echo "=== Backfill images terminé ==="
          echo "Sites traités : ${{ steps.backfill.outputs.sites_to_deploy }}"
          echo "Images générées : ${{ steps.backfill.outputs.images_generated }}"
          echo "Mode : ${{ inputs.dry_run && 'DRY-RUN (rien commit)' || 'réel' }}"
