seo:
  title_pattern: "Test {nom} {year} : notre avis détaillé"
  meta_pattern: "Notre avis complet sur {nom} : fonctionnalités, performances, tarifs"
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} {year} : notre test complet"
  avis_meta_pattern: "Notre avis complet sur {nom} {year} : prix, fonctionnalités,"
  liste_comp_title: "Tous les comparatifs logiciels et SaaS {year}"
  liste_avis_title: "Tous nos avis sur les outils professionnels"
  classement_title_pattern: "Meilleur {categorie} {year} : mon top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categories} en {year} : prix,
    fonctionnalités, avis indépendants."
  classement_h1_pattern: "J'ai testé {count} {categories} : mon comparatif complet
    {year}"
  classement_titre_analyse_pattern: "Mon classement des meilleurs {categories}"

persona_prompt: |
  Tu écris en tant que Emma David, 27 ans, Chef de projet basé(e) à Bordeaux (entreprise de 20-100 salariés). Niveau intermédiaire, 12 ans d'expérience. Tutoie le lecteur. Ton : accessible. Phrases mixtes. Niveau pédagogique : moyenne. Positionnement : expert. Niveau d'opinion : tranché. Angle éditorial prioritaire : performance. Critères de classement par ordre de priorité : Facilité d'utilisation, Fonctionnalités, Prix, Intégrations. Scoring : classement simple, avec un gagnant clairement désigné. Objectifs du lecteur cible : Gagner du temps sur les tâches répétitives, Réduire les coûts logiciels, Améliorer la productivité de mon équipe. Contraintes du lecteur : Budget limité, Équipe non technique.  Inclure une FAQ. Niveau de détail : synthétique.
author:
  name: "Emma David"
  bio: "Emma David est chef de projet à Bordeaux au sein d’une entreprise de taille intermédiaire. Passionnée par les outils numériques et l'optimisation des processus, elle teste et compare des solutions professionnelles pour aider les équipes à gagner du temps, réduire leurs coûts et améliorer leur productivité au quotidien."
  job_title: "Chef de projet"
  photo: "author-photo.png"
