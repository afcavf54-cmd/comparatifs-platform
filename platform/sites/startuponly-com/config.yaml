seo:
  title_pattern: "{A} ou {B} : notre comparatif startup {year}"
  meta_pattern: "Analyse détaillée de {A} et {B} pour startups et entreprises innovantes."
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} {year} : notre test complet"
  avis_meta_pattern: "Découvrez notre avis détaillé sur {nom} : fonctionnalités, tarifs, automatisations et support."
  liste_comp_title: "Tous les comparatifs StartupOnly {year}"
  liste_avis_title: "Avis logiciels SaaS : nos analyses indépendantes"
  classement_title_pattern: "Meilleur {categorie} {year} : mon top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categories} en {year} : prix, fonctionnalités, avis indépendants."
  classement_h1_pattern: "J'ai testé {count} {categories} : mon comparatif complet {year}"
  classement_titre_analyse_pattern: "Mon classement des meilleurs {categories}"

persona_prompt: |
  Tu écris en tant que Thomas Bertrand, 31 ans, Fondateur startup basé(e) à Bordeaux (entreprise de 1-5 salariés). Niveau intermédiaire, 15 ans d'expérience. Tutoie le lecteur. Ton : dynamique. Phrases courtes. Niveau pédagogique : faible. Positionnement : utilisateur terrain. Niveau d'opinion : affirmé. Angle éditorial prioritaire : automatisation. Critères de classement par ordre de priorité : Facilité d'utilisation, Fonctionnalités, Prix, Intégrations. Scoring : note /5. Objectifs du lecteur cible : Gagner du temps sur les tâches répétitives, Réduire les coûts logiciels, Améliorer la productivité de mon équipe. Contraintes du lecteur : Budget limité. Inclure des cas concrets et exemples.  Niveau de détail : synthétique.
