<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mon espace — Captain Parrainage</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0}body{background:#F4F7FB;font-family:Lexend,system-ui,sans-serif;color:#142B4F}a{text-decoration:none}</style>
</head><body>
<div id="cpRoot" style="container-type:inline-size">

<header style="background:#fff;border-bottom:1px solid #E3E9F2;position:sticky;top:0;z-index:50">
  <div style="max-width:1120px;margin:0 auto;padding:0 20px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="/" style="display:flex;align-items:center;gap:10px;font:700 18px Lexend,sans-serif;color:#142B4F"><span style="width:38px;height:38px;border-radius:50%;background:#142B4F;color:#F9BD43;display:grid;place-items:center;font:800 15px Lexend,sans-serif">CP</span>Captain <b style="color:#7A5300">Parrainage</b></a>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="who" style="font:400 13px Lexend,sans-serif;color:#7A89A1"></span>
      <button id="cpLogout" type="button" style="padding:9px 16px;border-radius:999px;border:1.5px solid #E3E9F2;background:#fff;color:#142B4F;font:600 13px Lexend,sans-serif;cursor:pointer">Déconnexion</button>
    </div>
  </div>
</header>

<section style="background:linear-gradient(165deg,#142B4F,#082044);color:#fff;padding:44px 0 36px">
  <div style="max-width:1120px;margin:0 auto;padding:0 20px">
    <span style="display:inline-flex;align-items:center;gap:8px;font:600 13px Lexend,sans-serif;color:#0B7F6F;background:#E3F7F3;padding:6px 14px;border-radius:999px">🔓 Accès débloqué</span>
    <h1 style="margin:14px 0 0;font:700 clamp(28px,4cqi,40px)/1.1 Lexend,sans-serif;letter-spacing:-.02em">Toutes les offres de parrainage</h1>
    <p style="margin:10px 0 0;font:400 clamp(15px,2cqi,18px) Lexend,sans-serif;color:#C9D4E5;max-width:620px">Voici la sélection complète, conditions et liens inclus. De nouvelles primes sont ajoutées chaque semaine.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px;max-width:620px">
      <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;text-align:center"><div class="cp-count" style="font:800 28px Lexend,sans-serif">…</div><div style="font:400 13px Lexend,sans-serif;color:#A9B8CE;margin-top:4px">offres</div></div>
      <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;text-align:center"><div class="cp-total" style="font:800 28px Lexend,sans-serif;color:#F9BD43">…</div><div style="font:400 13px Lexend,sans-serif;color:#A9B8CE;margin-top:4px">de primes</div></div>
      <div style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:18px;text-align:center"><div class="cp-nodep" style="font:800 28px Lexend,sans-serif;color:#A9E6DB">…</div><div style="font:400 13px Lexend,sans-serif;color:#A9B8CE;margin-top:4px">sans dépôt</div></div>
    </div>
  </div>
</section>

<main style="max-width:1120px;margin:0 auto;padding:28px 20px 72px">
  <div id="cpFilters" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px"></div>
  <ul id="cpOffresList" style="list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px"><li style="color:#7A89A1">Chargement des offres…</li></ul>
</main>

</div>
<script>window.CP_MODE='member';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/assets/cp.js?v=3"></script>
<script src="/assets/cp-offres.js?v=5"></script>
<script>(async function(){try{var s=await CP.getSession();if(s&&s.user){var w=document.getElementById('who');if(w)w.textContent=s.user.email;}}catch(e){}})();</script>
</body></html>
