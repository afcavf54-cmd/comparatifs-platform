# ============================================================
# CONFIG SITE -- comparateur-scpi
# ============================================================
site:
  slug: comparateur-scpi
  name: "Comparateur SCPI"
  domain: "https://comparateur-scpi.eu"
  www_preference: "www"
  base_path: ""
  logo_text: "Comparateur"
  logo_accent: "SCPI"
  tagline: "Comparatifs Comparateur SCPI 2026"
  year: 2026
  sheet_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSv0469bN0_2nPikgVhe825g74RbMjaVZFvjJnDSydA-C98NcrCJJiHZdX8-V9xeMW-cklNBRou3vK/pub?gid=0&single=true&output=csv"
  template: "comparatif-vs-scpi.html.j2"
  index_template: "index-scpi.html.j2"
  analytics_clicky: ""
  home_title: "111Comparateur SCPI 2026"
  home_description: "Comparez les meilleures SCPI en 2026 : rendements, frais, avis independants."
theme:
  accent: "#400000"
  accent2: "#E8410A"
  bg: "#F4F6FB"
  ink: "#0F1A2E"
  surface: "#FFFFFF"
  font_title: "DM Serif Display"
  font_body: "Outfit"
  google_fonts: "https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap"
criteria:
  - label: "TD 2026"
    field: td
    type: text
    suffix: "%"
  - label: "TRI"
    field: tri
    type: text
    suffix: "%"
  - label: "Prix de la part"
    field: prix_achat
    type: text
    suffix: "EUR"
  - label: "Prix de retrait"
    field: prix_retrait
    type: text
    suffix: "EUR"
  - label: "Investissement min."
    field: investissement_min
    type: text
  - label: "Frais de souscription"
    field: frais_souscription
    type: text
    suffix: "%"
  - label: "Frais de gestion"
    field: frais_gestion
    type: text
    suffix: "% TTC"
  - label: "TOF"
    field: tof
    type: text
    suffix: "%"
  - label: "Endettement"
    field: endettement
    type: text
    suffix: "%"
  - label: "Delai de jouissance"
    field: delai_jouissance
    type: text
    suffix: " mois"
  - label: "Pays"
    field: pays
    type: text
tag_classes:
  rendement: "tag-rendement"
  diversifiee: "tag-diversifiee"
  specialisee: "tag-specialisee"
  europeenne: "tag-europeenne"
seo:
  title_pattern: "test {A} vs {B} : comparatif {year}"
  meta_pattern: "Comparatif complet {A} vs {B} {year} : rendements, frais, avis."
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complete."
  category_label: "Comparatifs"
  category_url: "index.html#comparatifs"
  avis_title_pattern: "test Avis {nom} {year} : faut-il investir ?"
  avis_meta_pattern: "Notre avis complet sur {nom} {year} : rendement {td}%, frais, points forts et risques."
  liste_comp_title: "test Tous les comparatifs {site_name} {year}"
  liste_avis_title: "Avis {site_name} {year} : analyses independantes"
