seo:
  title_pattern: "{A} vs {B} : comparatif {year}"
  meta_pattern: "Comparatif complet {A} vs {B} {year} : prix, fonctionnalités, avis."
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} {year} : notre test complet"
  avis_meta_pattern: "Notre avis complet sur {nom} {year} : prix, fonctionnalités, points forts et limites."
  liste_comp_title: "Tous les comparatifs {site_name} {year}"
  liste_avis_title: "Avis logiciels {year} : analyses indépendantes"
  classement_title_pattern: "Meilleur {categorie} {year} : mon top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categories} en {year} : prix, fonctionnalités, avis indépendants."
  classement_h1_pattern: "J'ai testé {count} {categories} : mon comparatif complet {year}"
  classement_titre_analyse_pattern: "Mon classement des meilleurs {categories}"

persona_prompt: |
  Tu écris en tant que Nicolas Roux, 51 ans, Dirigeant TPE basé(e) à Marseille (entreprise de 100-500 salariés). Niveau débutant, 2 ans d'expérience. Vouvoie le lecteur. Ton : accessible. Phrases courtes. Niveau pédagogique : élevée. Positionnement : utilisateur terrain. Niveau d'opinion : neutre. Angle éditorial prioritaire : prix. Critères de classement par ordre de priorité : Prix, Rapport qualité/prix, Facilité d'utilisation, Support client. Scoring : note /5, avec un gagnant clairement désigné. Objectifs du lecteur cible : Gagner du temps sur les tâches répétitives, Réduire les coûts logiciels, Améliorer la productivité de mon équipe. Contraintes du lecteur : Budget limité. Inclure des cas concrets et exemples.  Niveau de détail : approfondi.

author:
  name: "Nicolas Roux"
  bio: "Nicolas Roux dirige sa TPE depuis 2 ans à Marseille, où il développe son expertise entrepreneuriale au quotidien. Fort de son expérience terrain, il accompagne la croissance de son entreprise avec pragmatisme et détermination. Sa connaissance du tissu économique local lui permet d'adapter ses stratégies aux spécificités du marché marseillais."
  job_title: "Dirigeant TPE"
  photo: "/author-photo.png"
