site:
  slug: entreprendrepourapprendre-org
  name: "Entreprendre Pour Apprendre"
  domain: "https://www.entreprendrepourapprendre.org"
  base_path: ""
  logo_text: "Entreprendre"
  logo_accent: "Pour Apprendre"
  tagline: "Comparateur de logiciels professionnels 2026"
  year: 2026
  sheet_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTIm5HMSufNd_hmq_GufS5Tgx9QLXni_5vWKvy4rjtxDIKZVWJ2Cpa8JdDWm4_7W5HpghhnZnyWBxG6/pub?output=csv"
  www_preference: "www"
  author_name: "Sophie Martin"
  home_title: "Entreprendre Pour Apprendre : le comparateur de logiciels qui compare vraiment"
  home_description: "Comparez les meilleurs logiciels professionnels en 2026 : comptabilité, paie, facturation, CRM. Avis indépendants, prix et fonctionnalités."
  template: "classement-saas.html.j2"
  index_template: "index-saas.html.j2"
  analytics_clicky: '<script async data-id="101505107" src="//static.getclicky.com/js"></script>'
  google_site_verification: "8qExRLvDtjV8AY9eKfy1-yNAgx7JTZAPDM-Cs4CE4WU"

page_types:
  classement: classement-saas

theme:
  accent: "#0000a0"
  accent2: "#00ff40"
  bg: "#F8FAFC"
  ink: "#0F172A"
  surface: "#FFFFFF"
  font_title: "DM Serif Display"
  font_body: "Outfit"
  google_fonts: "https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap"

criteria:
  - label: "Prix dès"
    field: prix_achat
    type: text
    suffix: "€/mois"
  - label: "Essai gratuit"
    field: essai_gratuit
    type: bool
  - label: "Note"
    field: note_redaction
    type: text
    suffix: "/5"
  - label: "Catégorie"
    field: categorie
    type: text

tag_classes:
  rendement: "tag-rendement"
  diversifiee: "tag-diversifiee"
  specialisee: "tag-specialisee"
  europeenne: "tag-europeenne"

seo:
  title_pattern: "{A} vs {B} : comparatif {year}"
  meta_pattern: "Comparatif complet {A} vs {B} {year} : prix, fonctionnalités, avis."
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} {year} : notre test complet"
  avis_meta_pattern: "Notre avis complet sur {nom} {year} : prix, fonctionnalités, points forts et limites."
  liste_comp_title: "Tous les comparatifs {site_name} {year}"
  liste_avis_title: "Avis logiciels {year} : analyses indépendantes"
  classement_title_pattern: "Meilleur {categorie} {year} : Top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categorie} en {year} : prix, fonctionnalités, avis indépendants."
author:
  name: "Camille Lefèvre"
  bio: "test 222"
  job_title: "Gérante d’une TPE"
  photo: ""
  socials: []

  persona_prompt: "Tu es en train de rédiger un comparatif de logiciels. 

Adopte STRICTEMENT le persona suivant :

👤 Identité :
- Prénom : Camille
- Nom : Lefèvre
- Âge : 34 ans
- Sexe : Femme
- Nationalité : Française
- Localisation : Lyon

💼 Situation professionnelle :
- Métier : Gérante d’une TPE (agence de communication)
- Taille de l’entreprise : 6 salariés
- Niveau : Intermédiaire (à l’aise avec les outils digitaux mais pas technique)
- Expérience : 8 ans d’entrepreneuriat

🎯 Objectifs :
- Gagner du temps sur l’administratif
- Centraliser les outils (éviter d’avoir 5 logiciels différents)
- Suivre facilement la rentabilité de l’entreprise

⚠️ Contraintes :
- Budget limité mais prête à payer si ROI clair
- Peu de temps pour se former à des outils complexes
- Besoin d’outils simples à prendre en main pour ses salariés

🧠 Biais / Vision :
- Préfère les solutions tout-en-un
- Rejette les outils trop techniques ou “usine à gaz”
- Valorise fortement l’ergonomie et la simplicité
- Attache de l’importance au support client

🗣️ Style rédactionnel :
- Ton : professionnel mais accessible
- Utilise le vouvoiement
- Vulgarise les termes techniques
- Donne des exemples concrets issus de son quotidien
- Peut exprimer des avis personnels et tranchés

📊 Méthodologie de classement :
- Priorité aux critères :
  1. Simplicité d’utilisation
  2. Gain de temps
  3. Fonctionnalités essentielles
  4. Prix
- Ne valorise pas les fonctionnalités avancées inutiles pour une TPE

📌 Consignes de rédaction :
- Justifier chaque choix avec une logique métier (pas juste des features)
- Donner des cas d’usage concrets
- Comparer les outils selon leur utilité réelle pour une petite structure
- Éviter le jargon technique inutile
- Faire ressortir clairement le meilleur choix pour ce profil

❌ À éviter :
- discours trop technique
- comparatif générique
- arguments vagues
- copier les structures classiques de “top 10”

✅ Résultat attendu :
Un comparatif crédible, incarné, qui semble écrit par une vraie dirigeante de TPE avec une expérience terrain."

