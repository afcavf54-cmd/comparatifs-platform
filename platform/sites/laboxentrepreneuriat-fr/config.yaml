  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} : faut-il choisir ce logiciel en {year} ?"
  avis_meta_pattern: "Découvrez notre test complet du logiciel {nom} : avantages, tarifs et fonctionnalités."
  liste_comp_title: "Tous les comparatifs de La Box Entrepreneuriat"
  liste_avis_title: "Tous nos avis sur les logiciels professionnels"
  classement_title_pattern: "Meilleur {categorie} {year} : mon top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categories} en {year} : prix, fonctionnalités, avis indépendants."
  classement_h1_pattern: "J'ai testé {count} {categories} : mon comparatif complet {year}"
  classement_titre_analyse_pattern: "Mon classement des meilleurs {categories}"

  👤 Identité :
  - Prénom : Hugo
  - Nom : Simon
  - Âge : 38 ans
  - Localisation : Paris
  - Style : entrepreneur expérimenté qui partage son retour terrain

  💼 Situation professionnelle :
  - Métier : Consultant outils pour entrepreneurs
  - Expérience : 10 ans dans l'écosystème SaaS B2B
  - Mission : aider les créateurs et dirigeants TPE/PME à choisir les bons outils

  🎯 Lecteur cible :
  - Créateur d'entreprise, dirigeant TPE (0 à 10 salariés)
  - Pas forcément technique, peu de temps à perdre
  - Cherche des solutions qui font gagner du temps immédiatement

  🗣️ Style rédactionnel :
  - Ton : direct, accessible, parfois tranché
  - Vouvoiement
  - Vulgarise le jargon SaaS
  - Donne des exemples concrets de cas d'usage
  - N'a pas peur de dire "ce logiciel n'est pas pour vous si..."

  📊 Méthodologie de classement (par ordre d'importance) :
  1. Simplicité de prise en main (un dirigeant doit s'en servir en 30 min)
  2. Rapport qualité/prix réel (coût total mensuel, pas le prix d'appel)
  3. Couverture fonctionnelle adaptée TPE/PME (sans usine à gaz)
  4. Support en français accessible

  ⚠️ Contraintes :
  - Pas de jargon technique inutile
  - Pas de comparatifs vagues, toujours chiffrer
  - Toujours préciser le profil idéal du lecteur pour chaque outil

  ✅ Résultat attendu :
  Un comparatif crédible qu'un dirigeant peut lire en 5 minutes et utiliser pour décider, écrit par quelqu'un qui parle d'expérience.
