# ============================================================
# CONFIG SITE -- laboxentrepreneuriat-fr
# Corrigé v2 (mai 2026) : passage en site classement.
# Changements :
#   - template: comparatif-vs-scpi → classement-saas
#   - index_template: index-scpi → index-saas
#   - criteria SCPI (TD/TRI/frais) → criteria SaaS génériques
#   - ajout des patterns SEO classement (classement_*_pattern)
#   - ajout du bloc author complet
#   - home_description rempli (SEO)
# ============================================================

site:
  slug: laboxentrepreneuriat-fr
  name: "laboxentrepreneuriat.fr"
  domain: "https://laboxentrepreneuriat.fr"
  base_path: ""
  logo_text: "laboxentrepreneuriat.fr"
  logo_accent: ""
  tagline: "Comparatifs laboxentrepreneuriat.fr 2026"
  year: 2026
  sheet_csv_url: ""
  www_preference: "www"
  author_name: "Hugo Simon"
  home_title: "laboxentrepreneuriat.fr | Comparatifs logiciels professionnels 2026"
  home_description: "Comparatifs indépendants de logiciels professionnels en 2026 : avis, prix, fonctionnalités. Trouvez l'outil adapté à votre entreprise."
  home_h1: "laboxentrepreneuriat.fr : Comparatifs de logiciels pour entrepreneurs"
  template: "classement-saas.html.j2"
  index_template: "index-saas.html.j2"
  analytics_clicky: ""

page_types:
  classement: classement-saas

theme:
  accent: "#808000"
  accent2: "#ff8000"
  bg: "#F4F6FB"
  ink: "#0F1A2E"
  surface: "#FFFFFF"
  font_title: "DM Serif Display"
  font_body: "Outfit"
  google_fonts: "https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600&display=swap"
  cta_color: "#ff8000"
  cta_text_color: "#ffffff"

criteria:
  - label: "Prix dès"
    field: prix_achat
    type: text
    suffix: "€/mois"
  - label: "Essai gratuit"
    field: essai_gratuit
    type: bool
  - label: "Note"
    field: note_redaction
    type: text
    suffix: "/5"
  - label: "Catégorie"
    field: categorie
    type: text

tag_classes:
  rendement: "tag-rendement"
  diversifiee: "tag-diversifiee"
  specialisee: "tag-specialisee"
  europeenne: "tag-europeenne"

seo:
  title_pattern: "{A} vs {B} : comparatif {year}"
  meta_pattern: "Comparatif complet {A} vs {B} {year} : prix, fonctionnalités, avis."
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} {year} : notre test complet"
  avis_meta_pattern: "Notre avis complet sur {nom} {year} : prix, fonctionnalités, points forts et limites."
  liste_comp_title: "Tous les comparatifs {site_name} {year}"
  liste_avis_title: "Avis logiciels {year} : analyses indépendantes"
  classement_title_pattern: "Meilleur {categorie} {year} : mon top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categories} en {year} : prix, fonctionnalités, avis indépendants."
  classement_h1_pattern: "J'ai testé {count} {categories} : mon comparatif complet {year}"
  classement_titre_analyse_pattern: "Mon classement des meilleurs {categories}"

author:
  name: "Hugo Simon"
  bio: "Je m'appelle Hugo Simon, j'accompagne les entrepreneurs dans le choix de leurs outils du quotidien. Mon objectif : vous aider à trouver les logiciels qui vous feront vraiment gagner du temps."
  job_title: "Expert outils entrepreneurs"
  photo: "/author-photo.png"
  socials: []
