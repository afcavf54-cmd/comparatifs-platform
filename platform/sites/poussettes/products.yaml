products:

  - slug: yoyo-2
    nom: "Yoyo 2"
    marque: "Babyzen"
    prix: 549
    poids: 6.2
    type: compact
    format_pliage: ultra-compact
    age: "0–4 ans"
    note_manip: 5
    note_confort: 4
    note_pliage: 5
    siege_auto: true
    note_amazon: "4.6"
    description: >
      Le Babyzen Yoyo 2 est la référence des poussettes compactes, plébiscitée
      par les parents voyageurs. Son poids de 6,2 kg et son format avion (entre
      dans les coffres de cabine) en font un choix unique. La suspension 4 roues
      et le siège réversible garantissent un confort quotidien sans compromis.

      Points forts : légèreté record, compatible cabine avion, pliage 1 seconde,
      finitions premium, vaste choix d'accessoires. Nacelle disponible en option.

      Points faibles : prix élevé, nacelle non incluse d'origine, coffre de
      rangement minimal, roues moins robustes en tout-terrain.

      Idéale pour : les city-parents, les grands voyageurs, les foyers avec
      plusieurs voitures ou petits coffres.
    points_forts:
      - "Poids ultra léger (6,2 kg)"
      - "Compatible cabine avion"
      - "Pliage en 1 seconde"
      - "Compatible siège auto"
    points_faibles:
      - "Prix élevé : 549€"
      - "Nacelle en option"
      - "Coffre minimal"
    verdict_si:
      - "Le plus léger du marché"
      - "Vous voyagez souvent"
      - "Pliage ultra compact prioritaire"

