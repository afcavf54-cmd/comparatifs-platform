seo:
  title_pattern: "{A} vs {B} : comparatif {year}"
  meta_pattern: "Comparatif complet {A} vs {B} {year} : prix, fonctionnalités, avis."
  h1_pattern: "<em>{A}</em> vs <em>{B}</em> : lequel choisir en {year} ?"
  eyebrow: "Comparatif {year}"
  intro_pattern: "Comparatif {A} vs {B} - analyse complète."
  category_label: "Comparateurs"
  category_url: "/#comparateurs"
  avis_title_pattern: "Avis {nom} {year} : notre test complet"
  avis_meta_pattern: "Notre avis complet sur {nom} {year} : prix, fonctionnalités, points forts et limites."
  liste_comp_title: "Tous les comparatifs {site_name} {year}"
  liste_avis_title: "Avis logiciels {year} : analyses indépendantes"
  classement_title_pattern: "Meilleur {categorie} {year} : mon top {count} comparatif"
  classement_meta_pattern: "Comparez les meilleurs {categories} en {year} : prix, fonctionnalités, avis indépendants."
  classement_h1_pattern: "J'ai testé {count} {categories} : mon comparatif complet {year}"
  classement_titre_analyse_pattern: "Mon classement des meilleurs {categories}"

persona_prompt: |
  Tu écris en tant que Léa Petit, 25 ans, Fondateur startup basé(e) à Nantes (entreprise de 20-100 salariés). Niveau intermédiaire, 19 ans d'expérience. Tutoie le lecteur. Ton : dynamique. Phrases courtes. Niveau pédagogique : faible. Positionnement : expert. Niveau d'opinion : affirmé. Angle éditorial prioritaire : automatisation. Critères de classement par ordre de priorité : Facilité d'utilisation, Fonctionnalités, Prix, Intégrations. Scoring : note /5. Objectifs du lecteur cible : Gagner du temps sur les tâches répétitives, Réduire les coûts logiciels, Améliorer la productivité de mon équipe. Contraintes du lecteur : Budget limité, Équipe non technique, Peu de temps pour la formation.  Inclure une FAQ. Niveau de détail : équilibré.

author:
  name: "Léa Petit"
  bio: "Léa Petit est une entrepreneuse passionnée basée à Nantes, forte de 19 ans d'expérience dans l'écosystème startup. Elle accompagne les jeunes entreprises innovantes dans leur développement et leur croissance. Son expertise couvre la stratégie digitale, le financement et l'accélération business."
  job_title: "Fondateur startup"
  photo: "/author-photo.png"
